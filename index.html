<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tương tác Thống kê dịch vụ</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9eceb;font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#48465f}.phone{width:min(375px,100%);margin:16px auto;background:#f4f5f4;padding:12px 10px 28px;min-height:780px}.heading{font-size:16px;font-weight:700;color:#007a3c;margin:6px 0 14px}.card{background:white;border-radius:12px;padding:12px;margin-bottom:10px}.filters{display:flex;gap:6px;align-items:center}.filters select{width:102px;flex-shrink:0;border:1px solid #e3e6e4;border-radius:7px;padding:9px 3px;background:white;color:#43465c;font-size:12px}.scroll{display:flex;gap:5px;overflow-x:auto;flex:1;min-width:0;touch-action:pan-x;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}.scroll button{flex:none;border:0;border-radius:7px;padding:9px 10px;background:#f2f3f2;color:#5a5d69;white-space:nowrap;font-size:11px}.scroll button.on{background:#dcf4e5;color:#007e42;font-weight:700}.filterbtn{border:1px solid #dce9df;background:#f1f8f3;color:#007a3c;border-radius:7px;padding:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}.dates{color:#8b8d94;font-size:11px;margin:11px 0}.summary{background:#edf9f0;padding:12px;border-radius:8px;display:flex;gap:12px}.summary>div{width:50%}.summary>div+div{border-left:1px solid #d8e7dc;padding-left:12px}.summary small{display:block;font-size:10px;color:#767c80}.summary strong{display:block;font-size:18px;margin:5px 0}.chart-title{font-weight:700;font-size:14px;color:#535353;margin-bottom:8px}.chart{width:100%;display:block;overflow:visible;touch-action:manipulation}.legend{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:4px}.legend span{font-size:10px;color:#636674}.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}.tip{position:absolute;pointer-events:none;display:none;background:#303335;color:#fff;padding:9px 11px;border-radius:8px;font-size:11px;box-shadow:0 5px 14px #0002;z-index:3;min-width:150px}.tip b{display:block;margin-bottom:6px}.tip div{margin-top:4px}.chartwrap{position:relative}.overlay{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:5}.sheet{background:#fff;color:#444;width:min(375px,100%);border-radius:18px 18px 0 0;padding:18px}.sheet h3{margin:0 0 16px}.sheet label{display:block;margin:10px 0 5px}.sheet input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#333}.sheet button{margin-top:15px;padding:12px;width:100%;border:0;border-radius:8px;background:#008b47;color:#fff}.sheet .cancel{background:#eee;color:#444;margin-top:8px}svg text{font-family:inherit}svg .hit{cursor:pointer}svg .hit:hover{stroke:#202020;stroke-width:1.1}.gridline{stroke:#e4e6e6;stroke-dasharray:3 4}.axis{fill:#8a8b95;font-size:9px}
</style></head><body><main class="phone"><div class="heading">Thống kê dịch vụ</div><section class="card"><div class="filters"><select id="unit"><option value="day">Theo ngày</option><option value="month">Theo tháng</option></select><div class="scroll" id="periods"><button data-p="1" class="on">1 tháng</button><button data-p="3">3 tháng</button><button data-p="6">6 tháng</button><button data-p="12">1 năm</button><button data-p="ytd">Từ đầu năm</button></div><button class="filterbtn" id="open" aria-label="Chọn khoảng thời gian"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="#007A3C" viewBox="0 0 256 256" aria-hidden="true"><path d="M227.81,66.76l-.08.09L160,139.17v55.49A16,16,0,0,1,152.87,208l-32,21.34A16,16,0,0,1,96,216V139.17L28.27,66.85l-.08-.09A16,16,0,0,1,40,40H216a16,16,0,0,1,11.84,26.76Z"></path></svg></button></div><div class="dates" id="dates"></div><div class="summary"><div><small>Tổng TK đang theo dõi</small><strong id="total">1.300</strong><small id="change">↗ +18 TK so với đầu kỳ</small></div><div><small>Tổng phí kỳ này</small><strong id="fees">500.000.000</strong></div></div></section><section class="card"><div class="chart-title">Tài khoản theo dõi</div><div class="chartwrap"><svg class="chart" id="accounts" viewBox="0 0 350 235" aria-label="Biểu đồ tài khoản theo dõi"></svg><div class="tip" id="accountTip"></div></div><div class="legend"><span><i class="dot" style="background:#00a653"></i>Tăng</span><span><i class="dot" style="background:#ed4245"></i>Giảm</span><span><i class="dot" style="background:#e6a500"></i>Tổng TK theo dõi</span></div></section><section class="card"><div class="chart-title">Phí theo dõi</div><div class="chartwrap"><svg class="chart" id="feeChart" viewBox="0 0 350 215" aria-label="Biểu đồ phí theo dõi"></svg><div class="tip" id="feeTip"></div></div><div class="legend"><span><i class="dot" style="background:#00a653"></i>Đăng ký mới</span><span><i class="dot" style="background:#e6a500"></i>Gia hạn</span></div></section></main><div class="overlay" id="overlay"><div class="sheet"><h3>Chọn khoảng thời gian</h3><label>Từ ngày</label><input id="start" type="date"><label>Đến ngày</label><input id="end" type="date"><div id="err" style="color:#dc3434;font-size:11px"></div><button id="apply">Áp dụng</button><button class="cancel" id="close">Đóng</button></div></div><script>
const NS='http://www.w3.org/2000/svg',endFixed='2026-11-16';let from='2026-10-17',to=endFixed,unit='day';const pad=n=>String(n).padStart(2,'0');const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const parse=s=>new Date(s+'T12:00:00');const format=s=>s.split('-').reverse().join('/');const money=n=>Math.round(n).toLocaleString('vi-VN');function addMonths(s,n){const d=parse(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return iso(d)}
const base=[];for(let d=parse('2025-11-01'),i=0;d<=parse(endFixed);d.setDate(d.getDate()+1),i++){const up=i%9===0?0:Math.round(5+Math.abs(Math.sin(i*.43))*15);const down=i%7===0?0:Math.round(3+Math.abs(Math.cos(i*.39))*11);const newer=i%8===0?0:Math.round((5+Math.abs(Math.sin(i*.23))*14)*1e6);const renew=i%6===0?0:Math.round((3+Math.abs(Math.cos(i*.31))*10)*1e6);base.push({date:iso(d),up,down,newer,renew})}
let running=920;for(const d of base){running+=d.up-d.down;d.total=running}
function chooseEvenly(a,n){if(a.length<=n)return a;return Array.from({length:n},(_,i)=>a[Math.round(i*(a.length-1)/(n-1))])}
function sample(){const rows=base.filter(d=>d.date>=from&&d.date<=to);if(!rows.length)return [];if(unit==='month'){const buckets=new Map();for(const d of rows){const key=d.date.slice(0,7);if(!buckets.has(key))buckets.set(key,{date:key,up:0,down:0,newer:0,renew:0,total:0});const b=buckets.get(key);b.up+=d.up;b.down+=d.down;b.newer+=d.newer;b.renew+=d.renew;b.total=d.total}const all=[...buckets.values()];return chooseEvenly(all,Math.min(6,all.length))}return chooseEvenly(rows,Math.min(6,rows.length))}
function svgEl(tag,attrs={},parent){const el=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);if(parent)parent.appendChild(el);return el}function txt(svg,x,y,s,attr={}){const t=svgEl('text',{x,y,...attr},svg);t.textContent=s;return t}function rect(svg,x,y,w,h,fill,attrs={}){return svgEl('rect',{x,y,width:w,height:Math.max(0,h),fill,...attrs},svg)}function line(svg,x1,y1,x2,y2,attrs={}){return svgEl('line',{x1,y1,x2,y2,...attrs},svg)}function dateLabel(d){return unit==='month'?d.date.slice(5,7)+'/'+d.date.slice(0,4):d.date.slice(8,10)+'/'+d.date.slice(5,7)}
function hookTip(node,svg,tip,group,html){const show=e=>{svg.querySelectorAll('[data-group]').forEach(x=>x.style.opacity=x.getAttribute('data-group')===group?'1':'.3');tip.innerHTML=html;tip.style.display='block';const r=svg.getBoundingClientRect();const x=(e.clientX||r.left+r.width/2)-r.left;tip.style.left=Math.max(0,Math.min(r.width-164,x-70))+'px';tip.style.top='12px'};node.addEventListener('pointerenter',show);node.addEventListener('pointermove',show);node.addEventListener('click',e=>{show(e);e.stopPropagation()})}function reset(svg,tip){svg.querySelectorAll('[data-group]').forEach(x=>x.style.opacity='1');tip.style.display='none'}
function drawAccounts(rows){const svg=document.getElementById('accounts'),tip=document.getElementById('accountTip');svg.replaceChildren();tip.style.display='none';if(!rows.length)return;const L=36,R=311,TOP=20,ZERO=125,BOTTOM=187;const maxBar=Math.max(20,...rows.flatMap(d=>[d.up,d.down]));const totals=rows.map(d=>d.total),tmin=Math.min(...totals)-10,tmax=Math.max(...totals)+10;for(let i=0;i<=4;i++){const y=TOP+i*(BOTTOM-TOP)/4;line(svg,L,y,R,y,{class:'gridline'});txt(svg,29,y+3,String(Math.round(maxBar-(i/4)*maxBar*1.6)),{class:'axis','text-anchor':'end'});txt(svg,342,y+3,String(Math.round(tmax-i/4*(tmax-tmin))),{class:'axis','text-anchor':'end'})}line(svg,L,ZERO,R,ZERO,{stroke:'#aeb5b3','stroke-width':'1'});const step=(R-L)/rows.length;const coords=[];rows.forEach((d,i)=>{const x=L+step*(i+.5),barW=Math.min(13,step*.27);const yTotal=TOP+(tmax-d.total)/(tmax-tmin)*(BOTTOM-TOP);coords.push([x,yTotal]);const label=dateLabel(d);txt(svg,x,214,label,{class:'axis','text-anchor':'middle'});if(d.up>0){const h=d.up/maxBar*90;const g=svgEl('g',{'data-group':`up-${i}`},svg);const bar=rect(g,x-barW-2,ZERO-h,barW,h,'#00a653',{rx:1.5,class:'hit'});hookTip(bar,svg,tip,`up-${i}`,`<b>${unit==='day'?format(d.date):label}</b><div style="color:#64e9a1">■ Tăng: ${d.up}</div><div><span style="color:#e6a500">●</span> Tổng TK theo dõi: ${money(d.total)}</div>`)}if(d.down>0){const h=d.down/maxBar*55;const g=svgEl('g',{'data-group':`down-${i}`},svg);const bar=rect(g,x+2,ZERO,barW,h,'#ed4245',{rx:1.5,class:'hit'});hookTip(bar,svg,tip,`down-${i}`,`<b>${unit==='day'?format(d.date):label}</b><div style="color:#ff8686">■ Giảm: -${d.down}</div><div><span style="color:#e6a500">●</span> Tổng TK theo dõi: ${money(d.total)}</div>`)}});svgEl('polyline',{points:coords.map(p=>p.join(',')).join(' '),fill:'none',stroke:'#e6a500','stroke-width':2.4,'stroke-linecap':'round','stroke-linejoin':'round','pointer-events':'none'},svg);coords.forEach(([x,y],i)=>{svgEl('circle',{cx:x,cy:y,r:2.5,fill:'#e6a500','pointer-events':'none'},svg);const hit=svgEl('circle',{cx:x,cy:y,r:9,fill:'transparent',class:'hit','data-group':`total-${i}`},svg);const d=rows[i];hookTip(hit,svg,tip,`total-${i}`,`<b>${unit==='day'?format(d.date):dateLabel(d)}</b><div><span style="color:#e6a500">●</span> Tổng TK theo dõi: ${money(d.total)}</div>`)});svg.onpointerleave=()=>reset(svg,tip);svg.onclick=e=>{if(e.target===svg)reset(svg,tip)}}
function drawFees(rows){const svg=document.getElementById('feeChart'),tip=document.getElementById('feeTip');svg.replaceChildren();tip.style.display='none';if(!rows.length)return;const L=36,R=325,TOP=18,BOTTOM=169,max=Math.max(1,...rows.map(d=>d.newer+d.renew)),step=(R-L)/rows.length;for(let i=0;i<=4;i++){const y=TOP+(BOTTOM-TOP)*i/4;line(svg,L,y,R,y,{class:'gridline'});txt(svg,29,y+3,Math.round(max*(1-i/4)/1e6)+'tr',{class:'axis','text-anchor':'end'})}rows.forEach((d,i)=>{const x=L+step*(i+.5),w=Math.min(26,step*.48),scale=(BOTTOM-TOP)/max;const g=svgEl('g',{'data-group':`fee-${i}`},svg);const h1=d.newer*scale,h2=d.renew*scale;if(d.newer>0)rect(g,x-w/2,BOTTOM-h1,w,h1,'#00a653',{rx:1.5,class:'hit'});if(d.renew>0)rect(g,x-w/2,BOTTOM-h1-h2,w,h2,'#e6a500',{rx:1.5,class:'hit'});const label=dateLabel(d);txt(svg,x,192,label,{class:'axis','text-anchor':'middle'});const tooltip=`<b>${label}</b>${d.newer?`<div style="color:#64e9a1">■ Đăng ký mới: ${money(d.newer)}</div>`:''}${d.renew?`<div style="color:#ffcf55">■ Gia hạn: ${money(d.renew)}</div>`:''}<div style="border-top:1px solid #666;padding-top:5px">Tổng phí: ${money(d.newer+d.renew)}</div>`;for(const node of g.querySelectorAll('rect'))hookTip(node,svg,tip,`fee-${i}`,tooltip)});svg.onpointerleave=()=>reset(svg,tip);svg.onclick=e=>{if(e.target===svg)reset(svg,tip)}}
function render(){document.getElementById('dates').textContent=format(from)+' - '+format(to);const rows=sample(),all=base.filter(d=>d.date>=from&&d.date<=to);const last=all.at(-1),first=base.findLast(d=>d.date<from);const net=last&&first?last.total-first.total:0;document.getElementById('total').textContent=money(last?.total||0);const changeEl=document.getElementById('change');changeEl.textContent=(net>0?'↗ +':net<0?'↘ ':'')+net+' TK so với đầu kỳ';changeEl.style.color=net>0?'#00A653':net<0?'#ED4245':'#767c80';document.getElementById('fees').textContent=money(all.reduce((s,d)=>s+d.newer+d.renew,0));drawAccounts(rows);drawFees(rows)}
document.getElementById('unit').onchange=e=>{unit=e.target.value;render()};document.querySelectorAll('[data-p]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-p]').forEach(b=>b.classList.remove('on'));btn.classList.add('on');to=endFixed;from=btn.dataset.p==='ytd'?'2026-01-01':addMonths(to,-Number(btn.dataset.p));render()});const overlay=document.getElementById('overlay');document.getElementById('open').onclick=()=>{document.getElementById('start').value=from;document.getElementById('end').value=to;overlay.style.display='flex'};document.getElementById('close').onclick=()=>overlay.style.display='none';document.getElementById('apply').onclick=()=>{const s=document.getElementById('start').value,e=document.getElementById('end').value;if(!s||!e||s>e||e>endFixed){document.getElementById('err').textContent='Ngày đến phải bằng hoặc sau ngày từ và không vượt ngày hiện tại.';return}from=s;to=e;overlay.style.display='none';document.querySelectorAll('[data-p]').forEach(b=>b.classList.remove('on'));render()};render();
</script></body></html>
